<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fundo do Calendário com cantos arredondados -->
  <rect x="4" y="6" width="40" height="36" rx="10" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Argolas/Ganchos do topo do calendário -->
  <rect x="12" y="3" width="4" height="6" rx="2" fill="#ffffff" />
  <rect x="32" y="3" width="4" height="6" rx="2" fill="#ffffff" />

  <!-- Cabeçalho do calendário -->
  <path d="M4 16h40" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />

  <!-- Grade de dias (pontos estilizados) -->
  <circle cx="14" cy="23" r="2" fill="rgba(255, 255, 255, 0.5)" />
  <circle cx="24" cy="23" r="2" fill="rgba(255, 255, 255, 0.5)" />
  <circle cx="34" cy="23" r="2" fill="rgba(255, 255, 255, 0.5)" />

  <circle cx="14" cy="31" r="2" fill="rgba(255, 255, 255, 0.5)" />
  <circle cx="24" cy="31" r="2" fill="rgba(255, 255, 255, 0.5)" />

  <!-- Cifrão / Símbolo Financeiro em destaque no canto inferior direito -->
  <circle cx="33" cy="32" r="8" fill="url(#checkGrad)" filter="url(#shadow)" />
  <text x="33" y="36.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">R$</text>
</svg>
